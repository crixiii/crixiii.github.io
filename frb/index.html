---
layout: default
title: frb energies
---

{% raw %}
<style>
  @font-face { font-family: "CMU Serif"; src: url("cmu-serif.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  .frb-app {
    --fg: #ffffff; --muted: #b4a8f5; --grid: rgba(201, 188, 255, 0.14); --accent: #c9bcff; --accent2: #ffb86b; --accent3: #6fe3c1;
    --band: #6a5fc4; --plot: #17133a; --panel: rgba(20, 16, 46, 0.82); --field: #14102e; --warn: #ffd479; --err: #ff9a9a;
    --light: #c9bcff; --mid: #8d7df0; --on-mid: #14102e;
  }
  :root[data-theme="light"] .frb-app {
    --fg: #2a2250; --muted: #5b4fb0; --grid: rgba(75, 63, 176, 0.14); --accent: #4b3fb0; --accent2: #c2570c; --accent3: #1b7f5c;
    --band: #cfc4ff; --plot: #fbf9ff; --panel: rgba(255, 255, 255, 0.7); --field: #ffffff; --warn: #8a5a00; --err: #b3261e;
    --light: #5b46c9; --mid: #6b58e0; --on-mid: #ffffff;
  }
  .frb-app * { box-sizing: border-box; }
  .frb-app [hidden] { display: none !important; }
  .frb-app .actions label { white-space: nowrap; }
  .frb-app h1 { margin: 0 0 24px; }
  .frb-app h2 { font-size: 1rem; letter-spacing: 0.04em; color: var(--light); margin: 0 0 12px; }
  .frb-app .layout { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 840px) { .frb-app .layout { grid-template-columns: 300px 1fr; align-items: start; } }
  .frb-app .panel { background: var(--panel); border: 3px solid var(--mid); padding: 16px; }
  .frb-app label.field { display: block; font-size: 0.95rem; color: var(--muted); margin: 0 0 4px; }
  .frb-app select { width: 100%; padding: 7px 8px; font: inherit; font-size: 1rem; color: var(--fg); background: var(--field); border: 2px solid var(--mid); border-radius: 0; margin-bottom: 14px; }
  .frb-app .group { margin-bottom: 14px; }
  .frb-app .group[hidden] { display: none; }
  .frb-app .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.95rem; color: var(--muted); }
  .frb-app .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .frb-app .row output { display: none; }
  .frb-app .row input[type="number"] {width: 90px; padding: 4px 6px; font: inherit; font-size: 0.9rem;
      color: var(--fg); font-variant-numeric: tabular-nums; background: var(--field);
      border: 2px solid var(--mid); border-radius: 0; text-align: right;}
  .frb-app input[type="range"] { width: 100%; accent-color: var(--mid); margin: 6px 0 0; }
/* remove the ugly slider arrows */
  .frb-app input[type="number"]::-webkit-inner-spin-button,
  .frb-app input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  
  .frb-app input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .frb-app .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 3px solid var(--mid); margin: -4px 0 14px; }
  .frb-app .tab { appearance: none; border: 0; background: none; color: var(--mid); font-family: "Pixelify Sans", monospace; font-size: 1.05rem; padding: 8px 12px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -3px; }
  .frb-app .tab:hover { color: var(--fg); }
  .frb-app .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
  .frb-app .tab:focus-visible, .frb-app button:focus-visible, .frb-app select:focus-visible, .frb-app input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .frb-app #plot { min-height: 280px; position: relative; }
  .frb-app #plot svg { display: block; width: 100%; height: auto; touch-action: pan-y; border: 2px solid var(--mid); background: var(--plot); }
  .frb-app .loader { display: flex; align-items: center; justify-content: center; min-height: 280px; color: var(--muted); text-align: center; padding: 0 16px; }
      .frb-app .loading-screen {
        width: min(340px, 100%);
        text-align: center;
        font-family: "Pixelify Sans", monospace;}
      .frb-app .loading-title {
        color: var(--light);
        font-size: 1.25rem;
        letter-spacing: 2px;
        margin-bottom: 12px;
        text-shadow: none;}
      .frb-app .loading-subtitle {
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 16px;}
      .frb-app .pixel-progress {
        height: 22px;
        padding: 3px;
        border: 3px solid var(--mid);
        background: var(--field);
        box-shadow: none;}
      .frb-app .pixel-progress-fill {
        height: 100%;
        width: 0%;
        background: var(--mid);
        transition: width 0.25s steps(8);
        box-shadow: inset 0 -3px rgba(20, 16, 46, 0.2);      }
      .frb-app .loading-percent {
        color: var(--light);
        font-size: 0.9rem;
        margin-top: 8px;
        text-align: right;}
      .frb-app .loading-blocks {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin-top: 22px;}
      .frb-app .loading-blocks span {
        width: 10px;
        height: 10px;
        background: var(--mid);
        animation: pixel-bounce 0.8s steps(2) infinite alternate;}
      .frb-app .loading-blocks span:nth-child(2) { animation-delay: 0.1s; }
      .frb-app .loading-blocks span:nth-child(3) { animation-delay: 0.2s; }
      .frb-app .loading-blocks span:nth-child(4) { animation-delay: 0.3s; }
      .frb-app .loading-blocks span:nth-child(5) { animation-delay: 0.4s; }
      @keyframes pixel-bounce {
        from { opacity: 0.35; transform: translateY(0); }
        to { opacity: 1; transform: translateY(-5px); }
      }
  .frb-app #readout { min-height: 1.5em; font-size: 0.95rem; color: var(--muted); margin: 8px 0 0; font-variant-numeric: tabular-nums; }
  .frb-app .actions { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 12px; font-size: 0.95rem; }
  .frb-app button.btn { font-family: "Pixelify Sans", monospace; font-size: 0.95rem; color: var(--light); background: transparent; border: 2px solid var(--mid); border-radius: 0; padding: 5px 10px; cursor: pointer; }
  .frb-app button.btn:hover { color: var(--fg); border-color: var(--fg); }
  .frb-app button.btn.primary { background: var(--mid); border-color: var(--mid); color: var(--on-mid); }
  .frb-app button.btn.primary:hover { background: var(--light); border-color: var(--light); color: var(--on-mid); }
  .frb-app .actions label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .frb-app #status { font-size: 0.9rem; color: var(--muted); margin: 12px 0 0; min-height: 1.2em; }
  .frb-app #status.error { color: var(--err); }
  .frb-app #card table { border-collapse: collapse; width: 100%; font-size: 1rem; margin-top: 10px; }
  .frb-app #card th, .frb-app #card td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid rgba(141, 125, 240, 0.4); font-weight: 400; }
  .frb-app #card th { color: var(--muted); }
  .frb-app #card td:nth-child(n+2) { font-variant-numeric: tabular-nums; }
  .frb-app #card p { font-size: 1rem; }
  .frb-app .pass { color: var(--accent3); } .frb-app .fail { color: var(--err); }
  .frb-app .caution { color: var(--warn); font-size: 0.95rem; margin: 10px 0 0; }
  @media (min-width: 840px) { .frb-app #plot svg { max-height: calc(100vh - 395px); min-height: 280px; } .frb-app h1 { margin-bottom: 12px; } .frb-app .group { margin-bottom: 6px; } .frb-app select { margin-bottom: 10px; } .frb-app .panel { padding: 12px; } }
</style>
<div class="frb-app">
  <h1>FRB beaming</h1>
  <div class="layout">
    <section class="panel" aria-label="controls">
      <h2>model</h2>
      <label class="field" for="beam">beam shape</label>
      <select id="beam"></select>
      <label class="field" for="dist">intrinsic energy distribution</label>
      <select id="dist"></select>
      <div id="sliders"></div>
      <div class="actions"><button class="btn" id="reset" type="button">reset to defaults</button><button class="btn" id="share" type="button">copy link</button></div>
    </section>

    <section class="panel" aria-label="results">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-tab="pdf">observed pdf</button>
        <button class="tab" role="tab" data-tab="profile">beam profile</button>
        <button class="tab" role="tab" data-tab="hist">simulated bursts</button>
        <button class="tab" role="tab" data-tab="heatmap">beam heatmap</button>
       </div>
      <div id="plot">
        <div class="loader" id="loader">
          <div class="loading-screen">
            <div class="loading-title">Loading FRBBeaming</div>
            <div class="loading-subtitle" id="loadingText">loading...</div>
            <div class="pixel-progress">
              <div class="pixel-progress-fill" id="loadingBar"></div>
            </div>
            <div class="loading-percent" id="loadingPercent">0%</div>
            <div class="loading-blocks">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </div>
      <p id="readout" aria-live="polite"></p>
      <div id="card"></div>
      <div class="actions" id="actions">
        <button class="btn" id="pin" type="button">pin curve</button>
        <button class="btn" id="unpin" type="button">clear pin</button>
        <label id="cdfWrap"><input type="checkbox" id="cdf"> 1 − cdf</label>
        <label><input type="checkbox" id="logy"> <span id="logyText">log y-axis</span></label>
        <label id="hmWrap">out to θ = <select id="hmRange"><option value="3.141592653589793">π (full sky)</option><option value="1.5707963267948966">π/2</option><option value="1">1 rad</option><option value="0.3">0.3 rad</option><option value="0.1">0.1 rad</option></select></label>
        <button class="btn" id="download" type="button">download png</button>
      </div>
      <p id="status" role="status"></p>
    </section>
  </div>

</div>
<script>
"use strict";
const DEFAULTS = {
  beam: "R-PL", dist: "lognormal", theta_p: 0.3, gamma_p: 300, sigma: 0.1, zeta: 1.7,
  lognorm_shape: 1.0, pl_index: 0.7, bpl_alpha1: 0.7, bpl_alpha2: 1.5, bpl_break_log: 41, n_sim: 100000, seed: 0
};
const BEAMS = [["Isotropic", "isotropic"], ["Gaussian", "gaussian"], ["Gaussian & Plateau", "gaussian with plateau"],
  ["Relativistic", "relativistic point source"], ["R-PL", "R-PL (power-law wings)"], ["R-G", "R-G (gaussian)"]];
const DISTS = [["single", "single energy"], ["lognormal", "log-normal"], ["powerlaw", "power-law"], ["broken_powerlaw", "broken power-law"]];
const PLATEAU = ["Gaussian & Plateau", "R-PL", "R-G"];
const GAUSS = ["Gaussian", "Gaussian & Plateau"];
const CONTROLS = [
  { id: "theta_p", label: "plateau radius θ_p [rad]", min: 0.01, max: 1, step: 0.01, show: (p) => PLATEAU.includes(p.beam) },
  { id: "sigma", label: "gaussian width σ [rad]", min: 0.02, max: 0.9, step: 0.01, show: (p) => GAUSS.includes(p.beam) },
  { id: "gamma_p", label: "lorentz factor Γ_p", min: 1, max: 4, step: 0.05, log: true, show: (p) => ["Relativistic", "R-PL", "R-G"].includes(p.beam) },
  { id: "zeta", label: "wing slope ζ", min: 1, max: 3, step: 0.1, show: (p) => p.beam === "R-PL" },
  { id: "lognorm_shape", label: "log-normal shape s", min: 0.01, max: 1, step: 0.05, show: (p) => p.dist === "lognormal" },
  { id: "pl_index", label: "power-law index α", min: 0.3, max: 2, step: 0.05, show: (p) => p.dist === "powerlaw" },
  { id: "bpl_alpha1", label: "index below break α₁", min: 0.3, max: 2, step: 0.05, show: (p) => p.dist === "broken_powerlaw" },
  { id: "bpl_alpha2", label: "index above break α₂", min: 0.3, max: 3, step: 0.05, show: (p) => p.dist === "broken_powerlaw" },
  { id: "bpl_break_log", label: "break energy [erg]", min: 38, max: 45, step: 0.1, fmt: (v) => "10^" + v.toFixed(1), show: (p) => p.dist === "broken_powerlaw" },
  { id: "n_sim", label: "simulated bursts", min: 3, max: 7.5, step: 0.1, log: true, fmt: (v) => Math.round(v).toLocaleString("en"), show: (p, tab) => tab === "hist" || tab === "bimodal" },
];
const LOGY_DEFAULT = { pdf: false, cdf: false, profile: true, hist: false, heatmap: true, bimodal: false };
const XLIM = [32, 43];

let params = { ...DEFAULTS };
let tab = "pdf";
const logy = { ...LOGY_DEFAULT };
const pinned = {};
const view = { cdf: false, hmRange: Math.PI };

const PURPLES = [
  "#10052a", "#1d0b46", "#2d125c", "#3e1d70",
  "#512b83", "#643c96", "#7850a7", "#8c67b7",
  "#a080c6", "#b49bd4", "#c7b5e0", "#d8cceb",
  "#e7e1f3", "#f2effa", "#fcfbff"
];

const lightMode = () =>
  document.documentElement.classList.contains("light");

const PLASMA = () => lightMode() ? [...PURPLES].reverse() : PURPLES;
  
const modeKey = () => (tab === "pdf" && view.cdf ? "cdf" : tab);
let lastSvg = null;

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- worker ---------- */
const worker = new Worker("worker.js" + location.search);
let ready = false;
let nextId = 1;
const waiting = new Map();
const cache = new Map();

function updateLoader(percent, message) {
  const bar = $("#loadingBar");
  const label = $("#loadingPercent");
  const text = $("#loadingText");

  if (bar) bar.style.width = percent + "%";
  if (label) label.textContent = percent + "%";
  if (text) text.textContent = message;
}

worker.onmessage = (event) => {
  const m = event.data;

  if (m.type === "status") {
    setStatus(m.text);

    const msg = m.text.toLowerCase();
    if (msg.includes("download")) updateLoader(25, "loading python...");
    else if (msg.includes("load")) updateLoader(55, "loading packages...");
    else if (msg.includes("scipy")) updateLoader(75, "simulating FRBs...");
    else updateLoader(15, m.text);}

  else if (m.type === "ready") {
    ready = true;
    updateLoader(100, "Ready!");
    setStatus("python ready");
    setTimeout(() => refresh(), 350);}

  else if (m.type === "fatal") {
    setStatus("could not start python: " + m.error, true);
    $("#loader").textContent = "Could not start python. Check your connection and reload.";}
  else if (m.type === "result") {
    const w = waiting.get(m.id);
    waiting.delete(m.id);
    if (m.ok) w.resolve(m); else w.reject(new Error(m.error));}
};
worker.onerror = (e) => setStatus("worker error: " + e.message, true);

function setStatus(text, isError = false) {
  const el = $("#status");
  el.textContent = text;
  el.classList.toggle("error", isError);
}

function payload(fn) {
  const p = { beam: params.beam, dist: params.dist, seed: 0 };
  for (const k of Object.keys(DEFAULTS)) if (!(k in p)) p[k] = DEFAULTS[k];
  for (const c of CONTROLS) {
    if (c.id === "n_sim") continue;
    if (c.show(params, tab)) p[c.id] = params[c.id];
  }
  if (fn === "compute_profile") p.dist = "single";
  if (fn === "compute_hist" || fn === "compute_bimodality") p.n_sim = Math.round(params.n_sim);
  return p;
}

async function getData(fn) {
  const arg = JSON.stringify(payload(fn));
  const key = fn + arg;
  if (cache.has(key)) return cache.get(key);
  const t0 = performance.now();
  const res = await new Promise((resolve, reject) => {
    const id = nextId++;
    waiting.set(id, { resolve, reject });
    worker.postMessage({ id, fn, arg });
  });
  const data = JSON.parse(res.data);
  data._ms = performance.now() - t0;
  cache.set(key, data);
  return data;
}

/* ---------- plotting ---------- */
function niceTicks(lo, hi, n = 5) {
  const raw = (hi - lo) / n;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const f = raw / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toPrecision(12));
  return out;
}
function fmtNum(v) {
  if (v === 0) return "0";
  const a = Math.abs(v);
  if (a >= 1000 || a < 0.01) return v.toExponential(0).replace("e+", "e");
  return String(+v.toPrecision(2));
}
const PLOT_FONT = "'CMU Serif', 'Latin Modern Roman', 'Computer Modern', serif";
const pow10Label = (k) => `10<tspan dy="-5" font-size="10">${k}</tspan>`;

function drawPlot(spec) {
  const css = getComputedStyle(document.querySelector(".frb-app"));
  const col = (n) => css.getPropertyValue(n).trim();
  const C = { fg: col("--fg"), mut: col("--muted"), grid: col("--grid"), acc: col("--accent"), acc2: col("--accent2"), acc3: col("--accent3"), band: col("--band"), bg: col("--plot") };
  const colour = { main: C.acc, pin: C.mut, alt: C.acc2, alt2: C.acc3, band: C.band };
  const narrow = $("#plot").clientWidth < 520;
  const W = narrow ? 420 : 640, H = narrow ? 380 : 400, m = narrow ? { l: 58, r: 12, t: 12, b: 50 } : { l: 66, r: 16, t: 14, b: 54 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const [x0, x1] = spec.xlim;
  const [y0, y1] = spec.ylim;
  const ylog = !!spec.ylog;
  const fy = ylog ? (v) => Math.log10(Math.max(v, 1e-300)) : (v) => v;
  const ly0 = fy(y0), ly1 = fy(y1);
  const X = (v) => m.l + ((v - x0) / (x1 - x0)) * iw;
  const Y = (v) => m.t + ih - ((fy(v) - ly0) / (ly1 - ly0)) * ih;
  const pts = (xs, ys) => xs.map((x, i) => `${X(x).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(" ");

  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title)}" font-family="${PLOT_FONT}" font-size="${narrow ? 16 : 14}">`;
  s += `<rect width="${W}" height="${H}" fill="${C.bg}"/><clipPath id="clip"><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}"/></clipPath>`;

  const yTicks = ylog
    ? Array.from({ length: Math.floor(ly1) - Math.ceil(ly0) + 1 }, (_, i) => Math.ceil(ly0) + i)
    : niceTicks(y0, y1);
  for (const t of yTicks) {
    const yy = ylog ? Y(10 ** t) : Y(t);
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="${C.grid}"/>`;
    s += `<text x="${m.l - 8}" y="${yy + 4}" text-anchor="end" fill="${C.mut}">${ylog ? pow10Label(t) : fmtNum(t)}</text>`;
  }
  const xTicks = spec.xpow10 ? Array.from({ length: Math.floor(x1 / 2) - Math.ceil(x0 / 2) + 1 }, (_, i) => (Math.ceil(x0 / 2) + i) * 2) : niceTicks(x0, x1);
  for (const t of xTicks) {
    s += `<line x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${m.t + ih}" stroke="${C.grid}"/>`;
    s += `<text x="${X(t)}" y="${m.t + ih + 18}" text-anchor="middle" fill="${C.mut}">${spec.xpow10 ? pow10Label(t) : fmtNum(t)}</text>`;
  }
  s += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="none" stroke="${C.mut}" stroke-opacity="0.5"/>`;
  s += `<text x="${m.l + iw / 2}" y="${H - 10}" text-anchor="middle" fill="${C.fg}">${spec.xlabel}</text>`;
  s += `<text transform="translate(16 ${m.t + ih / 2}) rotate(-90)" text-anchor="middle" fill="${C.fg}">${spec.ylabel}</text>`;

  s += `<g clip-path="url(#clip)">`;
  for (const L of spec.layers) {
    const c = colour[L.cls || "main"];
    if (L.type === "band") s += `<rect x="${X(L.x0)}" y="${m.t}" width="${Math.max(0, X(L.x1) - X(L.x0))}" height="${ih}" fill="${c}" opacity="0.6"/>`;
    else if (L.type === "vline") s += `<line x1="${X(L.x)}" x2="${X(L.x)}" y1="${m.t}" y2="${m.t + ih}" stroke="${C.mut}" stroke-dasharray="2 3"/>` +
      (L.label ? `<text x="${X(L.x) + 4}" y="${m.t + 12}" fill="${C.mut}" font-size="13">${L.label}</text>` : "");
    else if (L.type === "arrow") {
      const xx = X(L.x), yb = Y(0), yt = Y(L.h);
      s += `<line x1="${xx}" x2="${xx}" y1="${yb}" y2="${yt + 8}" stroke="${c}" stroke-width="2"/><polygon points="${xx},${yt} ${xx - 5},${yt + 10} ${xx + 5},${yt + 10}" fill="${c}"/>`;
    } else {
      const dash = L.cls === "pin" ? ` stroke-dasharray="5 4"` : L.dash ? ` stroke-dasharray="${L.dash}"` : "";
      if (L.fill) s += `<polygon points="${X(L.x[0])},${Y(y0)} ${pts(L.x, L.y)} ${X(L.x[L.x.length - 1])},${Y(y0)}" fill="${c}" opacity="0.14"/>`;
      s += `<polyline points="${pts(L.x, L.y)}" fill="none" stroke="${c}" stroke-width="${L.w || 2}"${dash} stroke-linejoin="round"/>`;
    }
  }
  s += `</g>`;

  let ly = m.t + 18;
  const lx = spec.legendRight ? W - m.r - 205 : m.l + 10;
  for (const e of spec.legend || []) {
    s += `<line x1="${lx}" x2="${lx + 20}" y1="${ly - 4}" y2="${ly - 4}" stroke="${colour[e.cls]}" stroke-width="2"${e.cls === "pin" ? ' stroke-dasharray="5 4"' : ""}/><text x="${lx + 26}" y="${ly}" fill="${C.fg}" font-size="13">${e.label}</text>`;
    ly += 16;
  }
  s += `<circle id="cross" r="4" fill="${C.acc}" stroke="${C.bg}" stroke-width="1.5" visibility="hidden"/></svg>`;

  const host = $("#plot");
  host.innerHTML = s;
  lastSvg = host.firstElementChild;
  const svg = lastSvg;
  if (spec.hover) {
    const hx = spec.hover.x, hy = spec.hover.y;
    const move = (ev) => {
      const r = svg.getBoundingClientRect();
      const px = ((ev.clientX - r.left) / r.width) * W;
      const xv = x0 + ((px - m.l) / iw) * (x1 - x0);
      let lo = 0, hi = hx.length - 1;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (hx[mid] < xv) lo = mid; else hi = mid; }
      const i = Math.abs(hx[lo] - xv) < Math.abs(hx[hi] - xv) ? lo : hi;
      const cross = svg.querySelector("#cross");
      if (xv < x0 || xv > x1) { cross.setAttribute("visibility", "hidden"); return; }
      cross.setAttribute("cx", X(hx[i])); cross.setAttribute("cy", Y(hy[i])); cross.setAttribute("visibility", "visible");
      $("#readout").textContent = `${spec.hover.xname} = ${hx[i].toPrecision(4)},  ${spec.hover.yname} = ${hy[i].toExponential(3)}`;
    };
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerleave", () => { svg.querySelector("#cross").setAttribute("visibility", "hidden"); });
  }
}

function stepXY(edges, dens, floor) {
  const x = [], y = [];
  for (let i = 0; i < dens.length; i++) { const d = dens[i] > 0 ? dens[i] : floor; x.push(edges[i], edges[i + 1]); y.push(d, d); }
  return { x, y };
}
const maxOf = (a) => a.reduce((m, v) => (v > m ? v : m), -Infinity);
const minPos = (a) => a.reduce((m, v) => (v > 0 && v < m ? v : m), Infinity);

function yRange(top, log) {
  if (log) { const t = top * 3; return [t / 1e6, t]; }
  return [0, top * 1.1];
}

function withPin(layers, legend, main) {
  const p = pinned[modeKey()];
  if (p) { layers.unshift({ ...p, cls: "pin", fill: false }); legend.push({ cls: "pin", label: "pinned" }); }
  return { x: main.x, y: main.y, type: main.type };
}

let cdfOffset = 0;
function cumulative(d) {
  const out = new Array(d.x.length);
  let inside = d.mass || 0;
  for (let i = 1; i < d.x.length; i++) inside += 0.5 * (d.y[i] + d.y[i - 1]) * (d.x[i] - d.x[i - 1]);
  cdfOffset = Math.max(0, 1 - inside);
  let acc = cdfOffset, stepped = d.mass == null || d.mass <= 0;
  for (let i = 0; i < d.x.length; i++) {
    if (i > 0) acc += 0.5 * (d.y[i] + d.y[i - 1]) * (d.x[i] - d.x[i - 1]);
    if (!stepped && d.x[i] >= d.e0) { acc += d.mass; stepped = true; }
    out[i] = acc;
  }
  return out;
}

function interp(xs, ys, v) {
  let lo = 0, hi = xs.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (xs[mid] <= v) lo = mid; else hi = mid; }
  const t = (v - xs[lo]) / (xs[hi] - xs[lo] || 1);
  return ys[lo] + Math.min(1, Math.max(0, t)) * (ys[hi] - ys[lo]);
}
function plasmaAt(t) {
  const colours = PLASMA();
  const rgb = colours.map((h) =>
    [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16))
  );

  const f = Math.min(1, Math.max(0, t)) * (rgb.length - 1);
  const i = Math.min(rgb.length - 2, Math.floor(f));
  const u = f - i;

  return rgb[i].map((c, k) => c + u * (rgb[i + 1][k] - c));}

async function viewHeatmap() {
  const d = await getData("compute_profile");
  const log = logy.heatmap;
  const tmax = view.hmRange;
  const gmax = maxOf(d.g), lo = 1e-3;
  const scale = (g) => (log ? (Math.log10(Math.max(g, lo)) - Math.log10(lo)) / (Math.log10(gmax) - Math.log10(lo)) : g / gmax);
  const N = 760, cv = document.createElement("canvas");
  cv.width = cv.height = N;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(N, N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = (i + 0.5) / N * 2 - 1, y = 1 - (j + 0.5) / N * 2, r = Math.hypot(x, y), o = 4 * (j * N + i);
    if (r > 1) { img.data[o + 3] = 0; continue; }
    const c = plasmaAt(scale(interp(d.theta, d.g, r * tmax)));
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);

  const css = getComputedStyle(document.querySelector(".frb-app"));
  const col = (n) => css.getPropertyValue(n).trim();
  const C = { fg: col("--fg"), mut: col("--muted"), bg: col("--plot") };
  const W = 540, H = 470, cx = 215, cy = 215, R = 190;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="beam strength heatmap" font-family="${PLOT_FONT}" font-size="15">`;
  s += `<rect width="${W}" height="${H}" fill="${C.bg}"/>`;
  const colours = PLASMA();
  s += `<defs><linearGradient id="cbar" x1="0" y1="1" x2="0" y2="0">${colours.map((h, k) => `<stop offset="${(k / (colours.length - 1)).toFixed(4)}" stop-color="${h}"/>`).join("")}</linearGradient></defs>`;s += `<image x="${cx - R}" y="${cy - R}" width="${2 * R}" height="${2 * R}" href="${cv.toDataURL("image/png")}"/>`;
  
  const rings = niceTicks(0, tmax, 4).filter((t) => t > 0 && t <= tmax * 1.001);
  for (const t of rings) {
    const rr = (t / tmax) * R;
    s += `<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-dasharray="2 4"/>`;
    s += `<text x="${cx + rr * Math.SQRT1_2 + 3}" y="${cy - rr * Math.SQRT1_2 - 3}" fill="#ffffff" stroke="#000000" stroke-opacity="0.35" stroke-width="2.5" paint-order="stroke" font-size="13">${fmtNum(t)}</text>`;
  }
  if (d.edge != null && d.edge <= tmax) s += `<circle cx="${cx}" cy="${cy}" r="${(d.edge / tmax) * R}" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${C.mut}" stroke-opacity="0.6"/>`;
  s += `<text x="${cx}" y="${H - 10}" text-anchor="middle" fill="${C.fg}">observer angle θ from the beam axis [rad]</text>`;
  const bx = 445, bw = 18, by = cy - R, bh = 2 * R;
  s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="url(#cbar)" stroke="${C.mut}" stroke-opacity="0.6"/>`;
  const ticks = log ? [-3, -2, -1, 0].filter((t) => 10 ** t <= gmax * 1.0001) : niceTicks(0, gmax, 5).filter((t) => t <= gmax * 1.0001);
  for (const t of ticks) {
    const f = log ? scale(10 ** t) : scale(t), yy = by + bh * (1 - f);
    s += `<line x1="${bx + bw}" x2="${bx + bw + 4}" y1="${yy}" y2="${yy}" stroke="${C.mut}"/><text x="${bx + bw + 8}" y="${yy + 5}" fill="${C.mut}">${log ? pow10Label(t) : fmtNum(t)}</text>`;
  }
  s += `<text transform="translate(${bx + bw + 56} ${cy}) rotate(-90)" text-anchor="middle" fill="${C.fg}">E<tspan dy="3" font-size="10">obs</tspan><tspan dy="-3">/E</tspan></text></svg>`;
  const host = $("#plot");

  lastSvg = host.firstElementChild;

    const rr = Math.hypot(px - cx, py - cy) / R;
    $("#readout").textContent = rr <= 1 ? `θ = ${(rr * tmax).toPrecision(3)} rad,  E_obs/E = ${interp(d.theta, d.g, rr * tmax).toExponential(3)}` : "";
  });

  $("#readout").textContent = "";

    $("#runBimodal").onclick = () => { bimodalRequested = true; refresh(); };
    card.innerHTML = "";
    $("#readout").textContent = "fits one and two gaussians to the simulated log10 E_obs above the incompleteness cut. loads scikit-learn on first use.";

  });
  currentMain = { x: st.x, y: st.y };
  drawPlot({ title: "two-component gaussian mixture fit", xlim: [lo, hi], ylim: range, ylog: log, xlabel: "log<tspan dy='3' font-size='10'>10</tspan><tspan dy='-3'> E</tspan><tspan dy='3' font-size='10'>obs</tspan><tspan dy='-3'> [erg]</tspan>", ylabel: "probability per dex", layers, legend });
  const ok = (v) => (v ? '<span class="pass">pass</span>' : '<span class="fail">fail</span>');

    <tr><td>Hartigan dip test</td><td colspan="3">not available in the browser</td></tr>
    <tr><td>components (μ, σ, weight)</td><td colspan="3">${r.means.map((mu, i) => `(${f(mu)}, ${f(r.stds[i])}, ${f(r.weights[i])})`).join(" &nbsp; ")}</td></tr>
  </table>
  <p>mixture-model criteria: ${ok(r.bimodal)} on ${b.n.toLocaleString("en")} bursts</p>
  <p class="caution">without the dip test this over-flags skewed single-peaked distributions. use the python package's full test before drawing conclusions.</p>`;

}

/* ---------- controls ---------- */
function buildControls() {
  const beam = $("#beam"), dist = $("#dist");
  BEAMS.forEach(([v, t]) => beam.add(new Option(t, v)));
  DISTS.forEach(([v, t]) => dist.add(new Option(t, v)));
  const host = $("#sliders");
  host.innerHTML = "";
  for (const c of CONTROLS) {
    const g = document.createElement("div");
    g.className = "group"; g.id = "g_" + c.id;
    g.innerHTML = `
      <div class="row">
        <label for="s_${c.id}">${c.label}</label>
        <input type="number" id="n_${c.id}" min="${c.log ? 10 ** c.min : c.min}" max="${c.log ? 10 ** c.max : c.max}" step="${c.log ? "any" : c.step}">
      </div>
      <input type="range" id="s_${c.id}" min="${c.min}" max="${c.max}" step="${c.step}">
    `;
    host.appendChild(g);
    
    const slider = g.querySelector(`#s_${c.id}`);
    const number = g.querySelector(`#n_${c.id}`);
    
    slider.addEventListener("input", () => {
      const v = +slider.value;
      params[c.id] = c.log ? 10 ** v : v;
      if (c.id === "n_sim") params.n_sim = Math.round(params.n_sim);
      syncControls(false);
      refresh(120);
    });
    
    number.addEventListener("change", () => {
      let v = Number(number.value);
    
      if (number.value === "" || !Number.isFinite(v)) {
        syncControls(); return;}    
      const min = c.log ? 10 ** c.min : c.min;
      const max = c.log ? 10 ** c.max : c.max;
    
      v = Math.max(min, Math.min(max, v));
      if (c.id === "n_sim") v = Math.round(v);
    
      params[c.id] = v;
      syncControls();
      refresh(120);
    });
  }
  beam.onchange = () => { params.beam = beam.value; syncControls(); refresh(); };
  dist.onchange = () => { params.dist = dist.value; syncControls(); refresh(); };
}

function syncControls(setSliders = true) {
  $("#beam").value = params.beam;
  $("#dist").value = params.dist;

  for (const c of CONTROLS) {
    $("#g_" + c.id).hidden = !c.show(params, tab);

    const val = params[c.id];

    $("#n_" + c.id).value = c.id === "n_sim" ? Math.round(val) : +(+val).toPrecision(6);

    if (setSliders) {
      $("#s_" + c.id).value = c.log ? Math.log10(val) : val;
    }
  }

  $("#logy").checked = logy[modeKey()];
  $("#cdf").checked = view.cdf;
  $("#cdfWrap").hidden = tab !== "pdf";
  $("#hmWrap").hidden = tab !== "heatmap";
  $("#hmRange").value = String(view.hmRange);
  $("#logyText").textContent = tab === "heatmap" ? "log colour scale" : "log y-axis";
  $("#pin").hidden = $("#unpin").hidden = tab === "heatmap";

  document.querySelectorAll(".tab").forEach((t) =>
    t.setAttribute("aria-selected", t.dataset.tab === tab)
  );
}

/* ---------- refresh loop ---------- */
let running = false, dirty = false, timer = null;
function refresh(delay = 0) {
  clearTimeout(timer);
  $("#plot").dataset.busy = "1";
  timer = setTimeout(() => { dirty = true; if (!running) loop(); }, delay);
  saveHash();
}
async function loop() {
  if (!ready) return;
  running = true;
  while (dirty) {
    dirty = false;
    $("#card").innerHTML = tab === "bimodal" ? $("#card").innerHTML : "";
    try {
      setStatus(["Relativistic", "R-PL", "R-G"].includes(params.beam) ? "computing… relativistic beams take a few seconds the first time" : "computing…");
      if (tab === "pdf") await viewPdf();
      else if (tab === "profile") { $("#card").innerHTML = ""; await viewProfile(); }
      else if (tab === "hist") await viewHist();
      else if (tab === "heatmap") { $("#card").innerHTML = ""; await viewHeatmap(); }
      else await viewBimodal();
    } catch (err) {
      setStatus("error: " + err.message, true);
    }
  }
  running = false;
  delete $("#plot").dataset.busy;
}

/* ---------- state in the url ---------- */
function saveHash() {
  try { history.replaceState(null, "", "#" + encodeURIComponent(JSON.stringify({ t: tab, p: params, c: view.cdf, r: view.hmRange }))); } catch (_) { /* ignore */ }
}
function loadHash() {
  try {
    const s = JSON.parse(decodeURIComponent(location.hash.slice(1)));
    if (s.p) for (const k of Object.keys(DEFAULTS)) if (typeof s.p[k] === typeof DEFAULTS[k]) params[k] = s.p[k];
    if (["pdf", "profile", "hist", "heatmap", "bimodal"].includes(s.t)) tab = s.t;
    if (s.c === true) view.cdf = true;
    if (typeof s.r === "number" && s.r > 0) view.hmRange = s.r;
  } catch (_) { /* no saved state */ }
}

/* ---------- wiring ---------- */
$("#tabs").addEventListener("click", (e) => {
  const t = e.target.closest(".tab");
  if (!t) return;
  tab = t.dataset.tab; syncControls(); $("#readout").textContent = ""; refresh();
});
$("#logy").addEventListener("change", (e) => { logy[modeKey()] = e.target.checked; refresh(); });
$("#cdf").addEventListener("change", (e) => { view.cdf = e.target.checked; syncControls(); refresh(); });
$("#hmRange").addEventListener("change", (e) => { view.hmRange = +e.target.value; refresh(); });
$("#pin").addEventListener("click", () => { if (currentMain) { pinned[modeKey()] = { type: "line", x: currentMain.x, y: currentMain.y }; refresh(); } });
$("#unpin").addEventListener("click", () => { delete pinned[modeKey()]; refresh(); });
$("#reset").addEventListener("click", () => { params = { ...DEFAULTS }; syncControls(); refresh(); });
$("#share").addEventListener("click", async () => {
  saveHash();
  try { await navigator.clipboard.writeText(location.href); setStatus("link copied"); } catch (_) { setStatus("copy the address bar to share this view"); }
});
let fontB64 = null;
async function fontData() {
  if (fontB64) return fontB64;
  const bytes = new Uint8Array(await (await fetch("cmu-serif.woff2")).arrayBuffer());
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return (fontB64 = btoa(bin));
}
$("#download").addEventListener("click", async () => {
  if (!lastSvg) return;
  try {
    const clone = lastSvg.cloneNode(true);
    const vb = lastSvg.viewBox.baseVal, scale = 4;
    clone.setAttribute("width", vb.width * scale);
    clone.setAttribute("height", vb.height * scale);
    const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
    style.textContent = `@font-face{font-family:'CMU Serif';src:url(data:font/woff2;base64,${await fontData()}) format('woff2');}`;
    clone.insertBefore(style, clone.firstChild);
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml" }));
    const img = new Image();
    img.src = url;
    await img.decode();
    const canvas = document.createElement("canvas");
    canvas.width = vb.width * scale; canvas.height = vb.height * scale;
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    const png = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(png);
    a.download = `frb-${tab}-${params.beam}-${params.dist}.png`.replace(/[^\w.-]+/g, "_");
    a.click(); URL.revokeObjectURL(a.href);
  } catch (err) { setStatus("could not make the png: " + err); }
});

document.addEventListener("themechange", () => refresh());
loadHash();
buildControls();
syncControls();
</script>
