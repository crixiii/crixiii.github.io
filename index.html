<html lang="en">
  
<head>
  
  <meta charset="UTF-8" />

    <style>
      /* page setup- colours etc i think :D */
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --darkestpurple: #0a0010;
        --darkpurple: #0e0020;
        --normpurple: #1a0535;
        --purpleglow: #2a0a4a;
        --accentcolour: #c9a8f0;
        --accentfaint: #6a5080;
        --maintext: #f0e8ff;
        --secondtext: #c8b8e8;
        --fainttext: #8a7aaa;
        --border: rgba(180, 120, 255, 0.12);
        --borderhover: rgba(180, 120, 255, 0.3);
      }

      html { scroll-behavior: smooth; }

      /* make a pretty bkg! */
      body {
        background: #04000c;
        color: var(--maintext);
        font-family: 'Figtree', sans-serif;
        font_weight: 325;
        overflow-x: hidden;
        position: relative;
      }

      
      
      
    </style>
  
</head>
